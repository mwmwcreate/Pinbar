name: Bug report
description: Pinbarの不具合を報告する
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pinbar version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS / Mac
      placeholder: macOS 26.0 / MacBook Air M4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
