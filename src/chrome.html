<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Pinbar</title>
    <link rel="stylesheet" href="bubble.css" />
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <div class="bubble">
      <div class="bubble-rim" aria-hidden="true"></div>
      <div class="notch" aria-hidden="true"></div>
      <div class="surface">
        <header class="toolbar">
          <div class="toolbar-group navigation">
            <button id="back" class="tool-button" type="button" title="戻る" aria-label="戻る">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="forward" class="tool-button" type="button" title="進む" aria-label="進む">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <button id="reload" class="tool-button" type="button" title="再読み込み（Shift でキャッシュを無視）" aria-label="再読み込み">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
            </button>
          </div>
          <div id="site-title" class="site-title">Website</div>
          <div class="toolbar-group actions">
            <button id="address-toggle" class="tool-button" type="button" title="アドレスバーを表示" aria-label="アドレスバーを表示">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9h18" /></svg>
            </button>
            <button id="pin" class="tool-button" type="button" title="ピン留め" aria-label="ピン留め">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5" /><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" /></svg>
            </button>
            <button id="detach" class="tool-button" type="button" title="ウィンドウを切り離す" aria-label="ウィンドウを切り離す">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 9V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h4" /><rect width="10" height="7" x="12" y="13" rx="2" /></svg>
            </button>
            <button id="browser" class="tool-button" type="button" title="通常ブラウザで開く" aria-label="通常ブラウザで開く">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6" /><path d="m21 3-9 9" /><path d="M15 3h6v6" /></svg>
            </button>
            <button id="close" class="tool-button" type="button" title="閉じる" aria-label="閉じる">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
            </button>
          </div>
        </header>
        <form id="address-form" class="address-row">
          <input id="address" type="text" inputmode="url" aria-label="URL" placeholder="URL を入力して Return" spellcheck="false" autocomplete="off" />
        </form>
      </div>
    </div>
    <script src="chrome.js"></script>
  </body>
</html>
