<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Pinbar</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <div class="notch" aria-hidden="true"></div>
    <div class="surface">
      <header class="toolbar">
        <div class="toolbar-group navigation">
          <button id="back" class="tool-button" type="button" title="戻る">←</button>
          <button id="forward" class="tool-button" type="button" title="進む">→</button>
          <button id="reload" class="tool-button" type="button" title="再読み込み">↻</button>
        </div>
        <div id="site-title" class="site-title">Website</div>
        <div class="toolbar-group actions">
          <button id="address-toggle" class="tool-button text-button" type="button" title="アドレスバー表示・非表示">URL</button>
          <button id="pin" class="tool-button" type="button" title="ピン留め">⌖</button>
          <button id="detach" class="tool-button" type="button" title="ウィンドウを切り離す">□</button>
          <button id="browser" class="tool-button" type="button" title="通常ブラウザで開く">↗</button>
          <button id="close" class="tool-button" type="button" title="閉じる">×</button>
        </div>
      </header>
      <form id="address-form" class="address-row">
        <input id="address" type="text" inputmode="url" aria-label="URL" spellcheck="false" />
      </form>
    </div>
    <script src="chrome.js"></script>
  </body>
</html>
